name: Build Windows local service
on:
  workflow_dispatch:
  push:
    tags: ['local-v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install packaging dependencies
        run: python -m pip install pyinstaller==6.16.0 openpyxl==3.1.5 pypdf==6.1.1
      - name: Test local service
        run: python -m unittest test_clinical_rules test_local_api test_catalog test_reference_updates test_analysis_table
      - name: Test record filtering and export safety
        run: node test-records.cjs
      - name: Build allowlisted portable package
        run: python packaging/build_windows.py
      - name: Smoke test packaged executable
        run: python packaging/smoke_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-local-service
          path: |
            release-build/ElderMedicationReview-Windows-x64.zip
            release-build/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/local-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Windows-local-service
          path: assets
      - name: Publish downloadable package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --title "Local service $GITHUB_REF_NAME" --notes "Windows x64 portable local service. Extract before running. No patient records or literature full text included. Clinical screening is partial and requires local reference verification; read SHARING.md."
